name: Publish npm
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed commit SHA
        required: true
        type: string
      dry_run:
        description: Validate without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: npm install --global npm@11.11.0
      - name: Build and evaluate host and client bundles
        run: BUTLER_PYTHON="$pythonLocation/bin/python" npm run build
      - name: Standalone contract tests
        run: bun test ./tests/build-launcher.test.ts ./tests/record-ref.test.ts ./tests/pipeline-agent-tools.test.ts
      - name: Check package payload
        run: npm pack --dry-run --ignore-scripts
      - name: Publish with OIDC provenance
        if: inputs.dry_run == false
        run: npm publish --access public --provenance --ignore-scripts

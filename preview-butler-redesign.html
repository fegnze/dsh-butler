  --bg:#eef0f4; --canvas:#ffffff; --surface-2:#f7f8fa; --chip:#ffffff;
  --line:#e6e8ee; --line-2:#dfe2ea;
  --fg:#1f2430; --fg-2:#5b6472; --fg-3:#8b94a3;
  --ok-bg:#e1f5ee; --ok-fg:#0f6e56; --ok-dot:#1d9e75;
  --warn-bg:#faeeda; --warn-fg:#854f0b; --warn-dot:#ef9f27;
  --fail-bg:#fcebeb; --fail-fg:#a32d2d; --fail-dot:#e24b4a;
  --info-bg:#eeedfe; --info-fg:#3c3489; --info-dot:#7f77dd;
  --sel:rgba(127,119,221,.10); --sel-line:#7f77dd;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0b0d12; --canvas:#14161c; --surface-2:#191c23; --chip:#1b1e26;
  --line:#262a34; --line-2:#2f3440;
  --fg:#e6e8ee; --fg-2:#a7b0be; --fg-3:#78818f;
  --ok-bg:rgba(29,158,117,.16); --ok-fg:#6ee7b7; --ok-dot:#34d399;
  --warn-bg:rgba(239,159,39,.16); --warn-fg:#fcd34d; --warn-dot:#fbbf24;
  --fail-bg:rgba(226,75,74,.16); --fail-fg:#fca5a5; --fail-dot:#f87171;
  --info-bg:rgba(127,119,221,.18); --info-fg:#c7c2f5; --info-dot:#a5a0ec;
  --sel:rgba(165,160,236,.14); --sel-line:#a5a0ec;
  --shadow:none;
}
.avatar,.avatar-sm,.old-avatar{background-image:var(--cat);background-size:cover;background-position:center;display:inline-block;flex-shrink:0}
.band{margin-top:20px}
.band-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.band-h h3{margin:0;font-size:13px;font-weight:600}
.band-to{margin-left:auto;font-size:11.5px;color:var(--fg-3);padding:2px 9px;border:1px solid var(--line);border-radius:999px}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(316px,1fr));gap:14px}
.fcard{border:1px solid var(--line);border-radius:12px;background:var(--chip);padding:12px 13px;box-shadow:var(--shadow)}
.fcard.bad{border-color:var(--warn-dot)}
.fc-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.fc-name{font-size:13px;font-weight:600}
.fc-id{font-size:11px;font-family:var(--mono);color:var(--fg-3)}
.fc-v{margin-left:auto;font-size:10.5px;color:var(--fg-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.fc-rows{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.fc-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fc-ctl .fc-k{font-size:10.5px;color:var(--fg-3);width:26px;flex-shrink:0}
.fbtn{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:11.5px;padding:4px 11px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);cursor:pointer}
.fbtn:hover{background:var(--sel);border-color:var(--sel-line)}
.fbtn i{font-style:normal;font-size:10px;opacity:.7}
.fc-reason{font-size:11.5px;color:var(--warn-fg);line-height:1.6}
.fc-out{margin-top:10px;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
  max-height:260px;overflow:auto}
.fc-out pre{margin:0;font-size:11px;line-height:1.7;white-space:pre-wrap;color:var(--fg-2)}
.fc-out .st{font-size:11.5px;color:var(--warn-fg)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.6;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

/* ── 顶部工具条 ─────────────────────────────────────────── */
.toolbar{z-index:30;flex-shrink:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 20px;background:var(--canvas);border-bottom:1px solid var(--line)}
.toolbar h1{font-size:14px;font-weight:600;margin:0}
.toolbar .src{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok-fg)}
.toolbar .sp{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:12px;padding:4px 11px;border-radius:7px;cursor:pointer;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg);box-shadow:var(--shadow);font-weight:500}
.tbtn{font:inherit;font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.tbtn:hover{border-color:var(--line-2)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2)}

/* ── 舞台 ───────────────────────────────────────────────── */
.stage{position:relative;display:flex;flex:1;min-height:0}
.frame{flex:1;display:grid;grid-template-columns:206px 1fr;min-width:0;min-height:0}

/* 左栏（DSH 侧栏模拟，仅作语境） */
.rail{background:var(--surface-2);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;font-weight:600;font-size:14px;letter-spacing:-.2px}
.brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#4d6bfe,#1c3ad9);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.brand .hb{font-size:8px;font-weight:700;letter-spacing:.4px;background:#111;color:#fff;border-radius:3px;padding:1px 4px}
.rail .new{display:flex;align-items:center;justify-content:center;gap:7px;margin:2px 0 10px;padding:8px;border:1px solid var(--line-2);
  border-radius:10px;background:var(--chip);font-size:13px;color:var(--fg)}
.rail .item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--fg-2)}
.rail .item.on{background:var(--sel);color:var(--fg);font-weight:500}
.rail .sec{margin-top:12px;padding:8px 10px 4px;font-size:11px;color:var(--fg-3)}
.rail svg{flex-shrink:0}
.avatar-sm{width:17px;height:17px;border-radius:5px;object-fit:cover}

/* 画布 */
.canvas{min-width:0;height:100%;overflow-y:auto;background:var(--canvas)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 28px 60px}

/* ── 新版：状态带 ───────────────────────────────────────── */
.statusbar{display:flex;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:11px;object-fit:cover;flex-shrink:0}
.who{min-width:0}
.who h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.2px}
.who p{margin:2px 0 0;font-size:12px;color:var(--fg-3)}
.verdict{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto;text-align:right}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:999px;background:currentColor;opacity:.85}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.fail{background:var(--fail-bg);color:var(--fail-fg)}
.pill.off{background:var(--surface-2);color:var(--fg-3)}
.stamp{font-size:11px;color:var(--fg-3)}
.stamp b{font-weight:500;color:var(--fg-2)}

/* 操作按钮 */
.act{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--chip);color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.solid{background:#3f3ad4;border-color:#3f3ad4;color:#fff}
[data-theme="dark"] .btn.solid{background:#6a63e8;border-color:#6a63e8}
.btn.solid:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:default}

/* ── 新版：指标条 ───────────────────────────────────────── */
.metrics{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:11px 2px 15px;border-bottom:1px solid var(--line);margin-bottom:20px}
.m{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--fg-3);padding:0 16px;border-right:1px solid var(--line)}
.m:first-child{padding-left:0}
.m:last-of-type{border-right:0}
.m b{font-size:14px;font-weight:600;color:var(--fg)}
.m b.dim{color:var(--fg-3);font-weight:500}
.m .gl{display:inline-flex;align-items:center;gap:5px}
.m .gl i{width:6px;height:6px;border-radius:999px}
.m.pushable{margin-left:auto;padding-right:0;border-right:0}
.i-ok{background:var(--ok-dot)} .i-warn{background:var(--warn-dot)} .i-fail{background:var(--fail-dot)} .i-off{background:var(--fg-3)}

/* ── 新版：两栏主区 ─────────────────────────────────────── */
.cols{display:grid;grid-template-columns:352px minmax(0,1fr);gap:20px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;background:var(--chip);box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line)}
.card>header h3{margin:0;font-size:13px;font-weight:600}
.cnt{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--fg-3)}
.cnt.hot{background:var(--warn-bg);color:var(--warn-fg)}
.cnt.bad{background:var(--fail-bg);color:var(--fail-fg)}

.group{padding:12px 15px 14px}
.group+.group{border-top:1px dashed var(--line)}
.gh{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--fg-3);text-transform:none;margin-bottom:9px;letter-spacing:.02em}
.gh em{font-style:normal;font-size:11px;color:var(--fg-3)}
ul.rows{list-style:none;margin:0;padding:0;display:grid;gap:7px}
li.row{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:9px;background:var(--surface-2);
  border-left:3px solid var(--fg-3);font-size:12.5px;line-height:1.55}
li.row.warn{border-left-color:var(--warn-dot)}
li.row.fail{border-left-color:var(--fail-dot)}
li.row.info{border-left-color:var(--info-dot)}
li.row .t{flex:1;min-width:0}
li.row .tg{flex-shrink:0;font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--chip);border:1px solid var(--line);color:var(--fg-3);white-space:nowrap}
li.row .hint{display:block;margin-top:3px;font-size:11.5px;color:var(--fg-3)}
li.row .go{font:inherit;font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--info-fg);cursor:pointer;flex-shrink:0}

.empty{display:flex;gap:11px;padding:15px;border-radius:10px;background:var(--ok-bg);color:var(--ok-fg)}
.empty svg{flex-shrink:0;margin-top:1px}
.empty b{display:block;font-size:13px;font-weight:600}
.empty span{font-size:12px;opacity:.85}

/* 日报 / 周报 */
.tabs{display:flex;gap:2px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tabs button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;padding:4px 11px;border-radius:7px;border:0;
  background:transparent;color:var(--fg-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--chip);color:var(--fg);font-weight:500;box-shadow:var(--shadow)}
.tabs .k{font-size:10.5px;color:var(--fg-3)}
.dlist{list-style:none;margin:0;padding:6px;display:grid;gap:2px}
.dlist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border-left:2px solid transparent}
.dlist li:hover{background:var(--surface-2)}
.dlist li[aria-current="true"]{background:var(--sel);border-left-color:var(--sel-line)}
.dlist .d{display:flex;flex-direction:column;width:56px;flex-shrink:0}
.dlist .d b{font-size:12px;font-weight:600}
.dlist .d em{font-style:normal;font-size:10.5px;color:var(--fg-3)}
.dlist .s{flex:1;min-width:0;font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist .ago{font-size:11px;color:var(--fg-3);flex-shrink:0}
.dbody{padding:15px 17px 17px;border-top:1px solid var(--line)}
.dbody h4{margin:0 0 8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.dbody h4 .tag{font-size:10.5px;font-weight:400;color:var(--fg-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.dbody p{margin:0;font-size:12.5px;line-height:1.75;color:var(--fg-2);max-width:74ch}
.dbody .foot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg-3)}
.dbody .foot .btn{padding:4px 10px;font-size:11.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.pending{display:flex;gap:11px;padding:16px;color:var(--fg-2)}
.pending svg{flex-shrink:0;margin-top:2px;color:var(--fg-3)}
.pending b{display:block;font-size:13px;font-weight:600;color:var(--fg)}
.pending span{font-size:12px;color:var(--fg-3)}

/* ── 新版：折叠明细 ─────────────────────────────────────── */
.folds{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:var(--chip);overflow:hidden}
details+details{border-top:1px solid var(--line)}
summary{display:flex;align-items:center;gap:9px;padding:11px 15px;cursor:pointer;font-size:12.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--surface-2)}
summary .caret{color:var(--fg-3);transition:transform .15s;font-size:10px}
details[open] summary .caret{transform:rotate(90deg)}
summary .sm{margin-left:auto;font-size:11.5px;color:var(--fg-3)}
.fbody{padding:2px 15px 15px}
.fbody ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fbody li{display:flex;align-items:center;gap:9px;font-size:12px;padding:6px 0;color:var(--fg-2)}
.fbody li i{width:6px;height:6px;border-radius:999px;flex-shrink:0}
.fbody li em{margin-left:auto;font-style:normal;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.fbody .split{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 24px}
pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.75;white-space:pre-wrap;color:var(--fg-2)}

/* 旧版复刻 */
.old{}
.old-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:12px 16px 24px;width:calc(100% - 32px)}
.old-head .old-avatar{width:64px;height:64px;border-radius:16px}
.old h2{font-size:14px;font-weight:500;margin:0 0 12px}
.old section{margin-bottom:28px}
.old ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.old .att{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn-fg)}
.old .att.fail{background:var(--fail-bg);color:var(--fail-fg)}
.old .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.old .fact{padding:14px 16px;border:1px solid rgba(0,0,0,.15);border-radius:8px}
[data-theme="dark"] .old .fact{border-color:rgba(255,255,255,.08)}
.old .fact b{display:block;font-size:15px;font-weight:500}
.old .fact span{font-size:12px;color:var(--fg-3);display:block;margin-bottom:6px}
.old .eps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px;font-size:13px}
.old .eps li{display:flex;align-items:center;gap:8px}
.old .eps em{margin-left:auto;font-style:normal;font-size:12px;color:var(--fg-3)}
.old .box{font-size:13px;line-height:1.6;padding:14px 16px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
[data-theme="dark"] .old .box{border-color:rgba(255,255,255,.08)}
.old .box.stack{padding:10px 12px}
.old .box .meta{font-size:12px;color:var(--fg-3);margin-bottom:4px}
.old .docbox{border:1px solid rgba(0,0,0,.15);border-radius:8px;padding:8px 12px}
[data-theme="dark"] .old .docbox{border-color:rgba(255,255,255,.08)}
.old .docbox h2{font-size:14px;font-weight:500;margin:0 0 8px;padding-top:8px}
.fw{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;background:var(--fail-fg);color:#fff;
  font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle;flex-shrink:0}
[data-theme="dark"] .fw{color:#1a1010}
.oldhead-note{font-size:11.5px;color:var(--fg-3);margin:0 16px 18px;padding:9px 12px;border:1px dashed var(--line-2);border-radius:8px}

/* 说明抽屉 */
.notes{position:absolute;inset:0 0 0 auto;width:min(420px,92vw);background:var(--canvas);border-left:1px solid var(--line);
  box-shadow:-14px 0 40px rgba(16,24,40,.10);transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;z-index:20;padding:18px 20px 40px}
.notes[data-open="true"]{transform:none}
.notes h3{font-size:13px;font-weight:600;margin:0 0 4px}
.notes .lead{font-size:12px;color:var(--fg-3);margin:0 0 18px}
.nfind{border-top:1px solid var(--line);padding:13px 0}
.nfind .n{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;background:var(--fail-fg);color:#fff;
  font-size:10px;font-weight:700;margin-right:7px;vertical-align:middle}
[data-theme="dark"] .nfind .n{color:#1a1010}
.nfind h4{margin:0 0 5px;font-size:12.5px;font-weight:600;display:inline}
.nfind p{margin:5px 0 0;font-size:12px;line-height:1.7;color:var(--fg-2);max-width:60ch}
.nfind p b{font-weight:600;color:var(--fg)}
.nfind .fix{color:var(--ok-fg)}
@media (max-width:1040px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .wrap{padding:18px 16px 48px}
}

.none{font-size:12px;color:var(--fg-3);padding:2px 0 4px}
</style>
</head>

const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const pad = n => String(n).padStart(2, '0');

function parseDay(iso) {
  const d = new Date(iso);
  return { d, key: pad(d.getMonth() + 1) + '-' + pad(d.getDate()), wd: WD[d.getDay()], iso };
}
function daysAgo(iso) {
  const diff = Math.round((Date.now() - new Date(iso).getTime()) / 86400000);
  if (diff <= 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  return diff + ' 天前';
}
function clockTime(iso) {
  const d = new Date(iso);
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ── 语义推导：把原始 payload 折成设计需要的判断 ─────────────────────── */
function derive(butler, catalog) {
  const lines = String(butler.doctor.output || '').split('\n').filter(Boolean);
  const todo = [];
  const seen = new Set();
  const push = (item, key) => { if (!seen.has(key)) { seen.add(key); todo.push(item); } };

  /* 同一件事只报一次：doctor 的 FAIL/WARN 在前，后面的来源若已在讲同一件事就跳过 */
  for (const l of lines) {
    if (l.startsWith('[FAIL]')) push({ level: 'fail', text: l.slice(6).trim(), tag: 'doctor' }, 'd:' + l);
  }
  for (const l of lines) {
    if (l.startsWith('[WARN]')) push({ level: 'warn', text: l.slice(6).trim(), tag: 'doctor' }, 'd:' + l);
  }
  if (butler.spool.records > 0 && !todo.some(t => /spool/.test(t.text))) {
    push({ level: 'warn', tag: 'spool', text: 'spool 积压 ' + butler.spool.records + ' 条待合并', action: 'run' }, 'spool');
  }
  for (const e of butler.endpoints) {
    if (e.status === 'ok') continue;
    if (todo.some(t => t.text.includes('端点 ' + e.id) || t.text.includes('端点' + e.id))) continue;
    push({ level: 'fail', text: '端点 ' + e.id + ' 未就绪（' + e.status + '）', tag: '端点' }, 'ep:' + e.id);
  }

  /* 待你决定：只有 candidates 才是真正等主人拍板的 */
  const decide = [];
  if (butler.candidates && butler.candidates.count > 0) {
    decide.push({
      level: 'info', tag: '周检候选',
      text: '周检留下 ' + butler.candidates.count + ' 条蒸馏候选待裁决',
      action: '查看候选',
    });
  }

  /* 核心能力 = faculties；tools / services / workflows 是扩展能力，归操作台 */
  const faculties = catalog.faculties || [];
  const rejected = catalog.rejected || [];
  const okEndpoints = butler.endpoints.filter(e => e.status === 'ok').length;

  return {
    decide, todo,
    doctorCounts: { p: butler.doctor.passed, w: butler.doctor.warnings, f: butler.doctor.failures },
    doctorLines: lines,
    endpoints: butler.endpoints, okEndpoints,
    journal: butler.journal, spool: butler.spool,
    caps: { faculties, rejected },
    status: butler.status,
  };
}

    const what = kind === 'daily' ? '还没有日报' : kind === 'weekly' ? '本周周报还没生成' : '还没有周检记录';
    return `<div class="pending">${ICON.clock}<span><b>${what}</b><span>${when}</span></span></div>`;
  }
  const rows = k.list.map((e, i) => {
    const p = parseDay(e.updatedAt);
    return `<li data-idx="${i}" aria-current="${i === 0}">
      <span class="d"><b class="num">${p.key}</b><em>${p.wd}</em></span>

}

        ? '<ul>' + attention.map(a => `<li class="att ${a.level === 'fail' ? 'fail' : ''}"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>${esc(a.text)}</li>`).join('') + '</ul>'
        : '<p style="font-size:13px;color:var(--fg-3);margin:0">暂无需要你处理的事项</p>'}
    </section>

    <section>
      <h2>概览 <span class="fw">3</span></h2>
      <div class="facts">
        <div class="fact"><span>端点健康</span><b class="num">${okE}/${butler.endpoints.length}</b></div>
        <div class="fact"><span>通过 / 警告 / 失败</span><b class="num">${butler.doctor.passed} / ${butler.doctor.warnings} / ${butler.doctor.failures}</b></div>
        <div class="fact"><span>journal 条数</span><b class="num">${butler.journal.records}</b></div>
        <div class="fact"><span>spool 待合并</span><b class="num">${butler.spool.records}</b></div>
      </div>
    </section>

    <section>
      <h2>端点 <span class="fw">3</span></h2>
      <ul class="eps">
        ${butler.endpoints.map(e => `<li><span style="width:6px;height:6px;border-radius:999px;background:${e.status === 'ok' ? '#1D9E75' : '#E24B4A'}"></span>${esc(e.id)}<em>v${e.version}</em></li>`).join('')}
      </ul>
    </section>

    <section>
      <h2>doctor 输出 <span class="fw">4</span></h2>
      <pre>${esc(lines.join('\n'))}</pre>
    </section>

    <section>
      <h2>最新日报 <span class="fw">5</span></h2>
      ${dg ? `<div class="box">
        <div style="font-weight:500;margin-bottom:6px">${esc(dg.name)}</div>
        <p style="margin:0;color:var(--fg-2)">${esc(dg.preview.slice(0, 220))}…</p>
      </div>` : '<p style="font-size:13px;color:var(--fg-3);margin:0">暂无日报</p>'}
    </section>

    <section>
      <h2>最近一条记录</h2>
      ${latest ? `<div class="box stack">
        <div class="meta">${esc(latest.source)} · ${esc(latest.type)}</div>
        <div>${esc(latest.text)}</div>
      </div>` : ''}
    </section>
  </div>
  <div class="oldhead-note" style="margin:6px 0 0">整页没有「周报」入口，也没有「核心能力」入口 <span class="fw">6</span>；所有边框写死 <code>rgba(0,0,0,.15)</code>，切到深色模式基本看不见 <span class="fw">7</span>。</div>`;
}

/* ── 日报 tab 切换 ────────────────────────────────────────────────────── */
function wireDigestTabs(digests) {
  const tabs = document.getElementById('dTabs');
  if (!tabs) return;
  const pane = document.getElementById('dPane');
  const KINDS = {
    daily: { list: digests.filter(e => /^daily-/.test(e.name)), label: '日报' },
    weekly: { list: digests.filter(e => /^weekly-/.test(e.name)), label: '周报' },
    audit: { list: digests.filter(e => /^audit-/.test(e.name)), label: '周检' },
  };
  tabs.addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-kind]');
    if (!btn) return;
    for (const b of tabs.querySelectorAll('button')) b.setAttribute('aria-selected', String(b === btn));
    const kind = btn.dataset.kind;
    pane.innerHTML = paneFor(KINDS[kind], kind, KINDS[kind].label);
    if (KINDS[kind].list.length) wireRows(pane, KINDS[kind].list, KINDS[kind].label);
  });
  if (KINDS.daily.list.length) wireRows(pane, KINDS.daily.list, '日报');
}
function wireRows(pane, list, label) {
  const ul = pane.querySelector('.dlist');
  if (!ul) return;
  ul.addEventListener('click', ev => {
    const li = ev.target.closest('li[data-idx]');
    if (!li) return;
    for (const x of ul.children) x.setAttribute('aria-current', String(x === li));
    const body = pane.querySelector('.dbody');
    if (body) body.outerHTML = bodyFor(list[Number(li.dataset.idx)], label);
  });
}

/* ── 装配 ─────────────────────────────────────────────────────────────── */
const state = { view: 'after', mode: 'real', theme: 'light' };

/** 当前渲染的 doctor 输出，供 faculty 的「端点巡检」报告按钮取用。 */
let CURRENT_DOCTOR = '';

/* 说明文字：每条 = [缺陷, 对策]，两段都允许内联 HTML */
const NOTES = [
  ['旧版把水平边距算了三遍', '外层 <code>padding:clamp(16px,3vw,32px)</code>、内层 <code>width:calc(100% - 32px)</code>、header 上再来一次 <code>margin:12px 16px 24px</code>。结果标题和卡片左边缘差一截。改成一个 1180px 居中容器只算一次，全页一条左基线。'],
  ['「待你决定」标题和数据是错的', '它列的是 doctor 输出里正则捞出的 WARN/FAIL —— 那是运维信号，不是等主人拍板的事；而真正待拍板的 <code>candidates</code> 反而压根没渲染。拆成「待你决定」（只放候选清单）与「待处理」（doctor、spool、端点），标题终于对上数据。'],
  ['同一份巡检结果说了四遍', '状态药丸、概览四卡、端点 3/3、doctor 的 PASS 行，四个地方讲的都是同一次巡检，口径还不一致。压成一条指标带 + 状态带上的结论药丸，「概览」整块删除。'],
  ['doctor 机器原文占据主视线', '它被直接铺在页面中段，视觉权重比「今天干了什么」还高。收进底部折叠区，标题行只留 exitCode 与 PASS/WARN/FAIL 计数，要细节才展开。'],
  ['只有「最新一条」，没有时间轴', '主人无法回答「这周三发生了什么」，而班次表里明明有日报（周一至四 18:45）和周报（周五 18:45）。改成 日报 / 周报 / 周检 三期 tab + 期号列表 + 选中期正文。'],
  ['没有「核心能力」板块', '按约定，Butler 的<b>核心能力 = faculties</b>，进 Butler 视图；<b>tools / services / workflows 是扩展能力，由操作台承接</b>，简报页不读也不报。旧版两块都没有。新版把它做成<b>控制面</b>：每项 faculty 给命令按钮与报告按钮，报告就地出结果。'],
  ['写死颜色，深色模式塌掉', '边框写死 <code>rgba(0,0,0,.15)</code>、状态色写死浅色 hex。DSH 深色模式下卡片边框几乎消失、浅底药丸变成亮块。颜色全部改走语义 token，随 <code>data-ds-dark-theme</code> 切换；数字统一 <code>tabular-nums</code>。'],
  ['「刷新」按了可能什么都不变', '按钮推到最右，离它要刷新的内容最远；而且只重读缓存，15 秒轮询内还会命中服务端 30 秒缓存，主人会以为坏了。<code>checkedAt</code> 明明拿到了却没渲染。合并为一个「重新巡检」（强制 doctor 重跑），旁边显示上次巡检时刻与用时。'],
  ['状态药丸直接印内部枚举值', '页面上写着 <code>healthy</code> / <code>warning</code>，主人得先背下映射表。改成结论句「巡检通过 / 巡检有警告」，枚举值不再出现。'],
  ['空态 / 加载态没设计', '空态只有一行灰字；加载态会掉进 <code>map[status] ?? offline</code> 变成灰药丸，看不出是没加载完还是离线。三态分开做：空态给绿勾 + 一行纯数字证据；周报空态写成「周五 18:45 生成，下一次就在明天」—— 可预期，不是「暂无」。'],
  ['核心能力的两个工程前提', '① <b>数据源</b>：faculties 来自 <code>GET /api/catalog</code> 的 <code>faculties[]</code> 与 <code>rejected[]</code>，当前实到 1 项 <code>journal · 观察总账</code>（命令 intake / run / install，报告 端点巡检 / 画像与铁律卡）。② <b>代理缺路由</b>：<code>dsh/index.js</code> 的 <code>ROUTES</code> <b>没有 catalog 这一条</b>，面板现在读不到 —— 需加一行白名单。另：faculties 没有 <code>hosted</code> 块、无常驻进程，所以简报里<b>不存在「未就绪」</b>；唯一值得报警的是清单被守护拒绝。'],
  ['命令按钮当前接不上', '<code>readOperations</code> 只返回 tools / workflows / services，<code>supervisor</code> 也不认 faculty —— <b>守护没有暴露 faculty 命令执行路由</b>。所以命令按钮点下去只会给出「未接入执行器」，报告按钮（只读）已经能出真实结果。要补齐：后端加一条 faculty 执行路由（复用 <code>butler.json</code> 的 <code>commands[]</code>，按 effect 走 write/external 审批）。'],
  ['响应式与行长', '两栏在 1040px 以下落成单栏；正文限 74ch，宽屏不再一行 100+ 字。'],
];

document.getElementById('notesList').innerHTML = NOTES.map((n, i) =>
  `<div class="nfind"><h4><span class="n">${i + 1}</span>${n[0]}</h4><p>${n[1]}</p></div>`).join('');

function draw() {
  const butler = state.mode === 'real' ? REAL_BUTLER : ALERT_BUTLER;
  const catalog = state.mode === 'real' ? REAL_CATALOG : ALERT_CATALOG;
  const digests = REAL_DIGESTS.entries;
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = state.view === 'after' ? renderAfter(butler, catalog, digests) : renderBefore(butler);
  if (state.view === 'after') wireDigestTabs(digests);
  document.getElementById('src').textContent =
    (state.mode === 'real' ? '真实快照' : '告警示例') + ' · ' + clockTime(SNAP_AT) + ' · 127.0.0.1:37900';
}

document.getElementById('viewSwitch').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-view]');
  if (!b) return;
  state.view = b.dataset.view;
  for (const x of ev.currentTarget.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
  draw();
});
document.getElementById('stateSwitch').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-state]');
  if (!b) return;
  state.mode = b.dataset.state;
  for (const x of ev.currentTarget.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
  draw();
});
document.getElementById('themeBtn').addEventListener('click', ev => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.body.dataset.theme = state.theme;
  ev.target.textContent = state.theme === 'light' ? '深色' : '浅色';
});
document.getElementById('notesBtn').addEventListener('click', () => {
  const n = document.getElementById('notes');
  n.dataset.open = n.dataset.open === 'true' ? 'false' : 'true';
});

document.addEventListener('click', ev => {
  /* 核心能力 · 报告按钮：就地出结果 */
  const rep = ev.target.closest('[data-report]');
  if (rep) {
    const out = rep.closest('.fcard').querySelector('.fc-out');
    const key = rep.dataset.report;
    const body = key === 'journal:doctor' ? CURRENT_DOCTOR : key === 'journal:card' ? CARD_OUTPUT : null;
    if (!out) return;
    if (!out.hidden && out.dataset.k === key) { out.hidden = true; out.dataset.k = ''; return; }
    out.hidden = false; out.dataset.k = key;
    out.innerHTML = body ? '<pre>' + esc(body) + '</pre>' : '<span class="st">这份报告还没接入输出</span>';
    return;
  }
  /* 核心能力 · 命令按钮：守护还没暴露 faculty 执行路由，如实说 */
  const cmd = ev.target.closest('[data-cmd]');
  if (cmd) {
    const out = cmd.closest('.fcard').querySelector('.fc-out');
    if (!out) return;
    const key = cmd.dataset.cmd;
    if (!out.hidden && out.dataset.k === key) { out.hidden = true; out.dataset.k = ''; return; }
    out.hidden = false; out.dataset.k = key;
    out.innerHTML = '<span class="st">' + esc(key.split(':')[1]) + ' 未接入执行器 · 守护尚未暴露 faculty 命令路由</span>';
    return;
  }
  if (ev.target.id === 'recheck') {
    const b = ev.target;
    b.disabled = true;
    b.textContent = '巡检中…';
    setTimeout(() => { b.disabled = false; b.innerHTML = ICON.refresh + '重新巡检'; }, 700);
  }
});

draw();
</script>
